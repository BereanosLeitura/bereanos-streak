<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B2A4A" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Bereanos | Leitura</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Tela de abertura: logo oficial sobre o azul-marinho até o app carregar -->
    <div id="abertura" aria-hidden="true"
      style="position:fixed;inset:0;z-index:100;background:#1B2A4A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease">
      <img src="/logo/vertical-branco.png" alt="" style="width:150px;height:auto;animation:abertura-entra .8s cubic-bezier(.2,.8,.2,1) both" />
      <span style="display:block;width:120px;height:2px;border-radius:2px;background:rgba(184,145,47,.22);overflow:hidden">
        <span style="display:block;height:100%;width:40%;background:#B8912F;border-radius:2px;animation:abertura-linha 1.2s ease-in-out infinite"></span>
      </span>
    </div>
    <style>
      @keyframes abertura-entra { from { opacity: 0; transform: translateY(8px) scale(.97) } to { opacity: 1; transform: none } }
      @keyframes abertura-linha { 0% { transform: translateX(-100%) } 100% { transform: translateX(250%) } }
      @media (prefers-reduced-motion: reduce) { #abertura * { animation: none !important } }
    </style>
    <script>
      document.getElementById('abertura').dataset.inicio = String(performance.now());
      // garantia: nunca fica presa mais de 8 segundos
      setTimeout(function () { var a = document.getElementById('abertura'); if (a) { a.style.opacity = '0'; setTimeout(function () { a.remove() }, 450) } }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
